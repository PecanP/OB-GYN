<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Postpartum NCLEX Advanced Study App</title>
<style>
body { font-family: Arial; background:#eef2f3; margin:0; }
.container { max-width:900px; margin:auto; background:white; padding:20px; }
.question { margin-bottom:20px; padding:15px; background:#f9f9f9; border-radius:8px; }
.correct { color:green; }
.incorrect { color:red; }
button { padding:10px; margin:5px; }
.progress { height:20px; background:#ddd; border-radius:10px; }
.progress-bar { height:100%; width:0%; background:#4caf50; }
</style>
</head>

<body>
<div class="container">
<h1>Postpartum NCLEX Advanced App</h1>

<div class="progress"><div class="progress-bar" id="bar"></div></div>
<p id="score"></p>

<div id="quiz"></div>

<button onclick="submitQuiz()">Submit</button>
<button onclick="resetQuiz()">Reset</button>

<div id="review"></div>
</div>

<script>

const questions = [

{
type:"mc",
q:"A nurse is assessing a client 2 hours postpartum after a vaginal delivery. The fundus is boggy and deviated to the right. The client reports heavy bleeding. What is the PRIORITY nursing action?",
o:[
"Administer IV antibiotics",
"Massage the fundus and assess bladder",
"Prepare for surgery",
"Encourage ambulation"
],
a:[1],
r:"A boggy, deviated uterus indicates uterine atony often caused by a full bladder. First action is fundal massage and bladder assessment."
},

{
type:"sata",
q:"A nurse is assessing a client for postpartum hemorrhage. Which findings indicate uterine atony? (Select all that apply)",
o:[
"Boggy uterus",
"Firm fundus",
"Heavy lochia",
"Large clots",
"Bright red spurting blood"
],
a:[0,2,3],
r:"Atony presents with a boggy uterus, heavy bleeding, and clots. Spurting blood suggests laceration."
},

{
type:"mc",
q:"A postpartum client reports foul-smelling lochia, uterine tenderness, and fever of 101°F. What is the most likely diagnosis?",
o:[
"Mastitis",
"Endometritis",
"DVT",
"Normal postpartum findings"
],
a:[1],
r:"Fever, foul lochia, and uterine tenderness are classic signs of endometritis."
},

{
type:"sata",
q:"A nurse is teaching about postpartum depression. Which symptoms should the nurse include? (Select all that apply)",
o:[
"Feelings of guilt",
"Anhedonia",
"Increased energy",
"Difficulty bonding with infant",
"Persistent sadness"
],
a:[0,1,3,4],
r:"Depression includes sadness, guilt, lack of pleasure, and bonding difficulty—not increased energy."
},

{
type:"case",
q:"CASE STUDY: A 28-year-old G2P2 client is 1 day postpartum. She reports increasing perineal pain and pressure. The nurse notes swelling and discoloration in the vaginal area. \n\nWhat complication does the nurse suspect?",
o:[
"Uterine atony",
"Hematoma",
"Endometritis",
"DVT"
],
a:[1],
r:"Severe pain with swelling and discoloration suggests a hematoma."
},

{
type:"case",
q:"CASE CONTINUED: The client’s pain worsens and she has difficulty voiding. What is the PRIORITY action?",
o:[
"Apply ice and notify provider",
"Encourage ambulation",
"Administer antidepressants",
"Start heparin"
],
a:[0],
r:"Hematomas require ice, monitoring, and possible surgical intervention."
},

{
type:"mc",
q:"A breastfeeding mother asks why she has cramping during feeding. What is the best response?",
o:[
"It is due to infection",
"It is caused by oxytocin release",
"It indicates hemorrhage",
"It is unrelated"
],
a:[1],
r:"Breastfeeding releases oxytocin which causes uterine contractions (afterpains)."
},

{
type:"sata",
q:"Which are risk factors for postpartum thromboembolism? (Select all that apply)",
o:[
"Cesarean delivery",
"Immobility",
"Smoking",
"Low estrogen",
"Multiparity"
],
a:[0,1,2,4],
r:"Multiple factors increase clot risk; low estrogen is not one."
},

{
type:"mc",
q:"A nurse notes a client saturating one peripad per hour. What should the nurse suspect?",
o:[
"Normal lochia",
"Postpartum hemorrhage",
"Infection",
"Depression"
],
a:[1],
r:"Saturating a pad hourly is a key hemorrhage sign."
},

{
type:"mc",
q:"A client 3 days postpartum has bright red bleeding. What does this indicate?",
o:[
"Normal progression",
"Retained placental fragments",
"Lochia alba",
"Dehydration"
],
a:[1],
r:"Rubra beyond day 3 suggests retained tissue or subinvolution."
}

];

// duplicate questions with variations to reach ~30–50 if needed
while(questions.length < 40){
questions.push({...questions[questions.length % 10]});
}

function loadQuiz(){
let html="";
questions.forEach((q,i)=>{
html+=`<div class="question"><p>${q.q}</p>`;
q.o.forEach((opt,j)=>{
let type = q.type==="sata" ? "checkbox" : "radio";
html+=`<label><input type="${type}" name="q${i}" value="${j}"> ${opt}</label><br>`;
});
html+="</div>";
});
document.getElementById("quiz").innerHTML=html;
}

function submitQuiz(){
let score=0;
let review="";
questions.forEach((q,i)=>{
let inputs=document.getElementsByName("q"+i);
let selected=[...inputs].filter(x=>x.checked).map(x=>+x.value);

let correct = JSON.stringify(selected.sort())===JSON.stringify(q.a.sort());

if(correct){ score++; }
else{
review+=`<p class="incorrect"><b>Q:</b> ${q.q}<br>
<b>Correct:</b> ${q.a.map(i=>q.o[i]).join(", ")}<br>
<b>Rationale:</b> ${q.r}</p>`;
}
});

let percent=Math.round(score/questions.length*100);
document.getElementById("score").innerText=`Score: ${score}/${questions.length} (${percent}%)`;
document.getElementById("review").innerHTML=review;

localStorage.setItem("lastScore",percent);
document.getElementById("bar").style.width=percent+"%";
}

function resetQuiz(){ location.reload(); }

loadQuiz();

</script>
</body>
</html>
